<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>Hello World</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #4f46e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f12;
        --card: #1c1c21;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --accent: #818cf8;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 40px 24px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 9vw, 3rem);
      line-height: 1.1;
      color: var(--accent);
    }
    p {
      margin-top: 12px;
      font-size: 1.05rem;
      color: var(--muted);
    }
    a.btn {
      display: block;
      margin-top: 28px;
      padding: 14px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World!</h1>
    <p>你好，世界 👋</p>
    <a class="btn" href="24/">玩 24 点 →</a>
  </main>
</body>
</html>
